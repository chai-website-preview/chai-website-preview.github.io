# Builds the site and pushes ONLY the generated dist/ to a separate public repo that
# GitHub Pages serves from. Keeps this (source) repo private on a free plan.
#
# Deploy at a ROOT url, never a project subpath: the vendored theme CSS in
# public/app/themes/chai/dist/main.css hardcodes url(/app/themes/...) for the hero banner, the nav
# texture and the Font Awesome icon font. Astro's `base` option cannot rewrite those, so a
# https://<org>.github.io/<repo>/ deploy would render without them. Use a <name>.github.io repo
# (served at the domain root) or a custom domain.
#
# One-time setup:
#   1. Create the org "chai-website-preview", then a PUBLIC repo in it named exactly
#      chai-website-preview.github.io. Enable Pages on it, serving from branch gh-pages.
#      Preview URL: https://chai-website-preview.github.io/
#   2. ssh-keygen -t ed25519 -f deploy_key -N ""
#      - add deploy_key.pub to the PUBLIC repo: Settings > Deploy keys (allow write)
#      - add deploy_key (private) to THIS repo: Settings > Secrets > Actions, name DEPLOY_KEY
#   3. EXTERNAL_REPO below is already set to chai-website-preview/chai-website-preview.github.io
#
# CUTOVER (only when taking over the live domain): set STAGING to "0" and add
#   cname: humancompatible.ai
# to the deploy step. While STAGING is "1" the build emits robots.txt "Disallow: /" and a
# noindex meta tag so the preview cannot compete with the live site in search.
name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  EXTERNAL_REPO: chai-website-preview/chai-website-preview.github.io
  STAGING: "1"
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-images-
      - run: npm ci
      - run: npm run build
        env:
          CHAI_STAGING: ${{ env.STAGING }}
      - name: Fail if the theme CSS is missing
        run: test -s dist/app/themes/chai/dist/main.css
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ env.EXTERNAL_REPO }}
          publish_branch: gh-pages
          publish_dir: ./dist
