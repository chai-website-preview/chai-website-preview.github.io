<script>
      function set_visibility(category,prio,visible) {
        var entries = document.getElementsByClassName('bib-entry ' + category + ' ' + prio);
        for (var i = 0; i < entries.length; i ++) {
          if (visible) {
            entries[i].classList.add('bib-visible');
          } else {
            entries[i].classList.remove('bib-visible');
          }
        }
        return false;
      }
      function set_threshold(category,threshold) {
        for (var i = 1; i < 6; i ++) {
          var button = document.getElementsByClassName('bib-button ' + category + ' ' + i);
          if (i < threshold + 1) {
            var color = '#95c73b';
            var visible = true;
          } else {
            var color = '#eeeeee';
            var visible = false;
          }
          set_visibility(category,i,visible);
          try {button[0].style.backgroundColor = color} catch (e) {}
        }
        var category_headers = document.getElementsByClassName('bib-media ' + category);
        for (var i = 0; i < category_headers.length; i ++) {
          if (category_headers[i].nextElementSibling.classList.contains('bib-visible')) {
            category_headers[i].classList.add('bib-visible');
          } else {
            category_headers[i].classList.remove('bib-visible');
          }
        }
        return false;
      }

      function set_all_thresholds(threshold) {
        var all_categories = document.querySelectorAll(".bib-category")
        for (var i = 0; i < all_categories.length; i ++) {
          set_threshold(all_categories[i].id, threshold);
        }
      }

      window.onload = function() {set_all_thresholds(2)}
    </script>
